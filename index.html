.link{color:var(--accentText);cursor:pointer}
</style>

<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useContext,createContext,useRef} = React;

/* ============================================================================

const slug = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,60)||"x";

 ["terracotta","#c1582f"],["mustard","#caa12f"],["cream","#efe6d4"],["sage","#9fb39a"],["green","#3f7d4f"],
 ["teal","#2f8f86"],["blue","#2f5fb5"],["navy","#1f2d52"],["sky","#8fb3d9"],["purple","#6b3fa0"],

function hexToRgb(h){h=(h||"").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function nearestColorName(hex){const[r,g,b]=hexToRgb(hex);let best="",bd=1e9;for(const[n,h]of NAMED_COLORS){const[R,G,B]=hexToRgb(h);const d=(r-R)**2+(g-G)**2+(b-B)**2;if(d<bd){bd=d;best=n;}}return best;}

const normHex = s => { s=(s||"").trim(); return s.startsWith("#")?s:"#"+s; };

// --- real pixel analysis: dominant colour + tone/hue histogram, in-browser ---
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);

const colorDist2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;

  return (na&&nb)?d/(Math.sqrt(na)*Math.sqrt(nb)):0;}
const _analysis=new Map();
function analyzeImage(url){
  if(!url) return Promise.resolve(null);
  if(_analysis.has(url)) return _analysis.get(url);
  const p=new Promise(resolve=>{
    const img=new Image(); img.crossOrigin="anonymous";
    img.onload=()=>{ try{
      const n=24,cv=document.createElement("canvas");cv.width=n;cv.height=n;

      r=Math.round(r/cnt);g=Math.round(g/cnt);b=Math.round(b/cnt);

// JSONP loader (for APIs without CORS, e.g. Tumblr).
let _jpId=0;
function jsonp(url){
  return new Promise((resolve,reject)=>{

/* ---------- providers 2 & 3: open-access museum collections (creator-grouped) ---------- */
function museumCollFromGroup(key,g,q){
  const items=g.works;
  return {id:cid(key,"creator-"+g.cidKey),provider:key,title:items[0].alt,
    curator:slug(g.name),curatorId:cid(key,"creator-"+g.cidKey),curatorName:g.name,
    n:items.length,cover:items[0].src,items,q,_creatorQuery:g.name};
}
function groupByCreator(arts){
  const m=new Map();
  for(const a of arts){const name=a.by||"Unknown maker"; if(name==="Unknown maker")continue;
    const k=a.cidKey||name; if(!m.has(k)) m.set(k,{cidKey:k,name,works:[]}); m.get(k).works.push(a);}
  return [...m.values()].sort((x,y)=>y.works.length-x.works.length);
}

// Keep the Art Institute to design/graphics, not random paintings/objects.
const AIC_DEPTS=["architecture and design","prints and drawings","photography and media","textiles","applied arts of europe"];
function aicOk(a){const dep=(a.department_title||"").toLowerCase(); if(AIC_DEPTS.some(d=>dep.includes(d)))return true;
  const t=((a.classification_title||"")+" "+(a.medium_display||"")+" "+(a.title||"")).toLowerCase();
  return /poster|print|drawing|photograph|textile|typograph|graphic|design|letter|book|magazine/.test(t);}
const P_AIC = {
  key:"ai", base:"https://api.artic.edu/api/v1",
  iiif:id=>`https://www.artic.edu/iiif/2/${id}/full/500,/0/default.jpg`,
  fields:"id,title,image_id,artist_title,artist_id,date_display,date_start,date_end,medium_display,department_title,classification_title,is_public_domain",
  norm(a){return{id:a.id,src:a.image_id?this.iiif(a.image_id):null,alt:a.title||"Untitled",
    sourceUrl:`https://www.artic.edu/artworks/${a.id}`,by:a.artist_title||null,
    cidKey:a.artist_id||a.artist_title,medium:a.medium_display||null,date:a.date_display||null};},
  async search(q,limit,page=SESSION_PAGE){const d=await getJSON(`${this.base}/artworks/search?q=${encodeURIComponent(q)}&limit=${limit}&page=${page}&fields=${this.fields}`);
    return (d.data||[]).filter(a=>a.image_id&&a.is_public_domain!==false&&!(a.date_end&&a.date_end<YEAR_FROM)&&!(YEAR_TO&&a.date_start&&a.date_start>YEAR_TO)&&aicOk(a)).map(a=>this.norm(a));},
  async list(q,per,page=SESSION_PAGE){const arts=await this.search(q,100,page);
    return groupByCreator(arts).slice(0,per).map(g=>museumCollFromGroup(this.key,g,q));},
  async getColl(native){const id=native.replace(/^creator-/,"");

    const g={cidKey:id,name:arts[0]?arts[0].by:"Unknown maker",works:arts};

// Wikimedia Commons — keyless, CORS via origin=*; huge breadth.
const P_WIKI = {
  key:"wk", base:"https://commons.wikimedia.org/w/api.php",
  async search(q,page=SESSION_PAGE){
    const offset=(page-1)*40;
    const url=`${this.base}?action=query&generator=search&gsrsearch=${encodeURIComponent("filetype:bitmap "+q)}&gsrnamespace=6&gsrlimit=40&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=600&format=json&origin=*`;
    const d=await getJSON(url);
    const pages=(d.query&&d.query.pages)?Object.values(d.query.pages):[];
    return pages.map(pg=>{const ii=pg.imageinfo&&pg.imageinfo[0]; if(!ii)return null; const meta=ii.extmetadata||{};
      const artist=stripHtml(meta.Artist&&meta.Artist.value)||null;
      const ys=((meta.DateTimeOriginal&&meta.DateTimeOriginal.value)||(meta.DateTime&&meta.DateTime.value)||"").match(/\d{4}/);
      const yr=ys?parseInt(ys[0],10):0;
      return {id:"wk"+pg.pageid,src:ii.thumburl||ii.url,alt:(pg.title||"").replace(/^File:/,"").replace(/\.[a-z0-9]+$/i,""),
        sourceUrl:ii.descriptionurl,by:artist,cidKey:slug(artist||""),medium:null,
        date:meta.DateTimeOriginal?stripHtml(meta.DateTimeOriginal.value):null,_year:yr};
    }).filter(x=>x&&x.src&&x.by&&!(x._year&&x._year<YEAR_FROM)&&!(YEAR_TO&&x._year&&x._year>YEAR_TO));
  },
  async list(q,per,page=SESSION_PAGE){const a=await this.search(q,page);return groupByCreator(a).slice(0,per).map(g=>museumCollFromGroup(this.key,g,q));},
  async getColl(native){const name=native.replace(/^creator-/,"").replace(/-/g," ");const a=await this.search(name);const g={cidKey:slug(name),name:a[0]?a[0].by:name,works:a};return museumCollFromGroup(this.key,g,g.name);},
  async getCurator(native){const coll=await this.getColl(native);return{curator:{handle:cid(this.key,native),name:coll.curatorName,avatar:null,bio:"",followers:null},collections:coll.items.length?[coll]:[]};},
};

  brutalist:["brutalist","brutalism","concrete"], collage:["collage","cutout","montage","zine"],
  editorial:["editorial","magazine","layout","spread"], fashion:["fashion","apparel","garment","runway"],
  photography:["photography","photo","photograph"], maximalist:["maximalist","maximalism","ornate"],
  monochrome:["monochrome","monotone","black and white"], risograph:["risograph","riso"],
  vaporwave:["vaporwave","retro","y2k"], analog:["analog","film","grain","35mm"],
  green:["green","sage","olive","emerald"], blue:["blue","navy","cobalt","azure"],
  red:["red","crimson","scarlet"], pink:["pink","rose","blush"], orange:["orange","amber","terracotta"],
};
function expandTerms(text){ const ws=(text||"").toLowerCase().split(/\s+/).filter(Boolean); const out=new Set();
  for(const w of ws){ out.add(w); (SYN[w]||[]).forEach(s=>out.add(s)); } return [...out]; }
function relevance(col, terms){
  const hay=((col.title||"")+" "+(col.curatorName||"")+" "+(col.items||[]).map(i=>(i.alt||"")+" "+(i.medium||"")).join(" ")).toLowerCase();
  let hits=0; for(const t of terms){ if(hay.includes(t)) hits++; } return hits;
}

async function listCollections(query, limit=24, page=SESSION_PAGE, rankText){
  const per=Math.max(8, Math.ceil(limit/PROV_ORDER.length)+5);
  const results = await Promise.allSettled(PROV_ORDER.map(k=>PROVIDERS[k].list(query, per, page)));
  const lists = results.map(r=>r.status==="fulfilled"?r.value:[]);
  const merged=[]; let i=0; let added=true;
  while(added){added=false; for(const l of lists){ if(l[i]){merged.push(l[i]); added=true;} } i++;}
  if(merged.length===0) throw new Error("all sources empty");
  if(rankText){ // real query: keep on-topic results, rank by relevance + source quality
    const terms=expandTerms(rankText);
    const scored=merged.map(c=>({c,s:relevance(c,terms)}));
    const hits=scored.filter(x=>x.s>0);
    const pool=hits.length>=8?hits:scored; // drop unrelated when we have enough matches
    pool.sort((a,b)=> (b.s*5+(PROV_WEIGHT[b.c.provider]||1)) - (a.s*5+(PROV_WEIGHT[a.c.provider]||1)) );
    return pool.map(x=>x.c).slice(0, limit);
  }
  // browse: curated sources float up, with randomness for freshness
  return merged.map(c=>[(PROV_WEIGHT[c.provider]||1)+Math.random(), c]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0, limit);
}
async function getCollection(id){const [p,n]=splitId(id); const c=await PROVIDERS[p].getColl(n);
  let related=[]; try{ related=(await listCollections(c.q||c.title.split(/\s+/)[0],6)).filter(x=>x.id!==c.id).slice(0,4);}catch(e){}
  return {collection:c, related};}
async function getCurator(handle){const [p,n]=splitId(handle); return PROVIDERS[p].getCurator(n);}

// Real colour search: build a varied pool from the CORS-clean sources (so the
// canvas can read pixels), measure each cover's true dominant colour, and rank
// by distance to the picked colour.
// Colour search, optionally narrowed by a text query (e.g. "typography posters").
// Pools the CORS-readable sources so the canvas can measure true dominant colour.
async function colorSearchCollections(hex, query, limit=24){
  const target=hexToRgb(hex);
  let pool=[];
  if(query){
    const tasks=[P_VAM.list(query,14),P_AIC.list(query,14)];
    if(keyGet("unsplash")) tasks.push(P_UNSPLASH.list(query,12));
    const r=await Promise.allSettled(tasks);
    for(const x of r){ if(x.status==="fulfilled") pool.push(...x.value); }
  } else {
    const seeds=["poster","textile","pattern","abstract","photograph","graphic","print","colour","landscape","portrait"];
    const tasks=[]; for(const q of seeds){ tasks.push(P_VAM.list(q,4)); tasks.push(P_AIC.list(q,4)); }
    const r=await Promise.allSettled(tasks);
    for(const x of r){ if(x.status==="fulfilled") pool.push(...x.value); }
  }
  const seen=new Set(); pool=pool.filter(c=>c.cover&&!seen.has(c.id)&&seen.add(c.id));
  const scored=[];
  await Promise.all(pool.slice(0,110).map(async c=>{const a=await analyzeImage(c.cover);if(!a)return;
    c.dom=a.hex;c.colorScore=1-Math.min(1,Math.sqrt(colorDist2(a.rgb,target))/441);scored.push(c);}));
  scored.sort((x,y)=>y.colorScore-x.colorScore);
  if(!scored.length) throw new Error("no colour-readable images");
  return scored.slice(0,limit);
}
// Split a query into a colour (if any colour word appears) and the rest.
function parseSearch(raw){
  const words=(raw||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  let color=null; const rest=[];
  for(const w of words){ const m=NAMED_COLORS.find(([n])=>n===w); if(m&&!color) color=m[1]; else rest.push(w); }
  return {color, text:rest.join(" ")};
}

/* ============================================================================
   LLM — generate one image-generation prompt from a set of selected images.
   Uses a vision model in the browser with a user-supplied key (stored locally),
   and falls back to a metadata-only draft when no key is set.
============================================================================ */
const LLM_KEY_STORE = "sourced.llmKey";
const LLM_MODEL = "claude-sonnet-4-6";
function getKey(){try{return localStorage.getItem(LLM_KEY_STORE)||"";}catch(e){return "";}}
function setKey(k){try{localStorage.setItem(LLM_KEY_STORE,k);}catch(e){}}

const PROMPT_BRIEF =
  "You are an art director writing ONE image-generation prompt from these reference images. Read them as a single mood, then write a vivid, specific, paste-ready prompt of 70–110 words as flowing prose (no labels or lists), following this spine:\n"+
  "1) OPENING — lead with the SUBJECT and the primary STYLE/medium (the most load-bearing words first).\n"+
  "2) BODY — colour palette (name the key colours), then light and mood, composition and framing, texture and materials, and era/reference.\n"+
  "3) CONNECTION — close with the unifying intent (why it coheres) plus technical modifiers (aspect ratio, finish, level of detail).\n"+
  "Commit to ONE clear output FORMAT and name it — poster, editorial spread, risograph print, studio photograph, 3D render, woven textile, cut-paper collage, packaging, record sleeve, etc. Open AND close differently every single time; never reuse a stock opening or ending, and never start with the same word. Be concrete and a little unexpected; surface a specific detail you actually see. "+
  "Describe a real visual SUBJECT or scene — never a category word like 'graphic design' or 'general' as the subject. Do NOT include any names, signatures, captions, or category words meant to be rendered as text in the image; keep lettering out entirely unless it is genuinely central to the references. "+
  "Avoid filler words ('cohesive','aesthetic','visually striking','seamless'). Do not name or imitate real artists. Output only the prompt.";
// Gather factual metadata from the selected images, incl. extracted dominant colours.
// Drop filenames, UUIDs, hashes and "Untitled" so they never become a subject.
const isBadTitle = t => !t || /\.(png|jpe?g|gif|webp|svg|tiff?)$/i.test(t)
  || /^[0-9a-f]{8}-[0-9a-f]{4}/i.test(t) || /^[0-9a-f]{12,}$/i.test(t)
  || /[•·|]/.test(t)
  || /^(general|graphic design|design|untitled|misc(ellaneous)?|various|collection|set|inspiration|reference|mood\s?board)\b/i.test(t.trim())
  || /^(img|dsc|image|untitled|screenshot)[\s_\-0-9]*$/i.test(t.trim());
async function collectMeta(items){
  const titles=[...new Set(items.map(i=>i.alt).filter(t=>t&&!isBadTitle(t)))].slice(0,6);
  const media=[...new Set(items.map(i=>i.medium).filter(Boolean))].slice(0,4);
  const makers=[...new Set(items.map(i=>i.by).filter(Boolean))].slice(0,4);
  const dates=[...new Set(items.map(i=>i.date).filter(Boolean))].slice(0,4);
  const cols=[]; await Promise.all(items.slice(0,8).map(async it=>{const a=await analyzeImage(it.src); if(a)cols.push(nearestColorName(a.hex));}));
  return {titles, media, makers, dates, palette:[...new Set(cols)].slice(0,5)};
}
function metaSummary(m){
  if(!m) return "";
  const p=[];
  if(m.titles&&m.titles.length) p.push("titles: "+m.titles.join("; "));
  if(m.media&&m.media.length) p.push("media: "+m.media.join(", "));
  if(m.dates&&m.dates.length) p.push("approx era: "+m.dates.join(", "));
  if(m.palette&&m.palette.length) p.push("extracted palette: "+m.palette.join(", "));
  return p.join(" | ");
}

const DESCRIBE_BRIEF =
  "You are an art director studying reference images one at a time, in order. For EACH image, extract exactly what you see — do not react to the set as a whole yet, just observe this one image. "+
  "Return ONLY a JSON array (no prose, no markdown fences), one object per image, shaped like: "+
  '{"subject":"the concrete visual subject or scene, never a category word like \'graphic design\'","palette":["2-4 named colours actually present"],"texture":"the dominant surface or material quality","detail":"one specific, unexpected visual detail worth keeping"}. '+
  "If an image is abstract with no clear subject, describe the composition itself as the subject. Never invent artist names, titles, or text.";
async function describeImagesLLM(items, key){
  const content=[{type:"text",text:DESCRIBE_BRIEF}];
  for(const it of items.slice(0,8)){ if(it.src) content.push({type:"image",source:{type:"url",url:it.src}}); }
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:LLM_MODEL,max_tokens:700,temperature:0.6,messages:[{role:"user",content}]})});
  if(!r.ok){let m="";try{m=(await r.json()).error?.message||"";}catch(e){} throw new Error("Model "+r.status+(m?": "+m:""));}
  const d=await r.json();
  const txt=(d.content||[]).map(b=>b.text||"").join("").trim().replace(/^```json\s*|```\s*$/g,"");
  try{ const arr=JSON.parse(txt); return Array.isArray(arr)?arr:[]; }catch(e){ return []; }
}
function notesSummary(notes){
  if(!notes||!notes.length) return "";
  return notes.map((n,i)=>{
    const parts=[];
    if(n.subject) parts.push(n.subject);
    if(n.palette&&n.palette.length) parts.push("palette: "+[].concat(n.palette).join(", "));
    if(n.texture) parts.push("texture: "+n.texture);
    if(n.detail) parts.push("detail: "+n.detail);
    return `Image ${i+1} — `+parts.join("; ");
  }).join("\n");
}
async function generatePromptLLM(items, key, meta){
  const ms=metaSummary(meta);
  // Two-step chain: first observe each image individually, then synthesize from
  // those notes (text-only) rather than asking the model to look-and-write at once.
  // Falls back to the original one-shot (raw images + metadata) if the observe
  // step errors or returns unparseable output, so quality never regresses.
  const notes=await describeImagesLLM(items,key).catch(()=>[]);
  const content=[];
  if(notes.length){
    const ns=notesSummary(notes);
    content.push({type:"text",text:PROMPT_BRIEF+"\n\nPer-image notes from studying each reference individually:\n"+ns+(ms?("\n\nReference metadata (use as factual grounding): "+ms):"")});
  } else {
    content.push({type:"text",text:PROMPT_BRIEF+(ms?("\n\nReference metadata from the images (use as factual grounding, but describe what you actually see): "+ms):"")});
    for(const it of items.slice(0,8)){ if(it.src) content.push({type:"image",source:{type:"url",url:it.src}}); }
  }
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:LLM_MODEL,max_tokens:600,temperature:1,messages:[{role:"user",content}]})});
  if(!r.ok){let m="";try{m=(await r.json()).error?.message||"";}catch(e){} throw new Error("Model "+r.status+(m?": "+m:""));}
  const d=await r.json();
  const text=(d.content||[]).map(b=>b.text||"").join("").trim();
  return {text, notes};
}
function draftPromptFromMetadata(items, meta){
  meta = meta || {titles:[...new Set(items.map(i=>i.alt).filter(t=>t&&!isBadTitle(t)))].slice(0,4),
    media:[...new Set(items.map(i=>i.medium).filter(Boolean))].slice(0,2),
    makers:[...new Set(items.map(i=>i.by).filter(Boolean))].slice(0,2), dates:[], palette:[]};
  const titles=meta.titles||[], makers=meta.makers||[], pal=(meta.palette||[]).slice(0,4), dates=(meta.dates||[]).slice(0,2);
  const mediaMeta=(meta.media||[]).map(m=>String(m).toLowerCase()).slice(0,2);
  const R=a=>a[Math.floor(Math.random()*a.length)];
  const cap=s=>s.replace(/^./,c=>c.toUpperCase());
  const openers=[
    "One frame that distils the whole set —","Picture a single image holding this mood —",
    "Render one scene built from these references —","A lone composition charged with this spirit —",
    "Translate the entire board into a single image —","Conjure one piece from these references —",
    "Distil the set into a single frame —"
  ];
  const formats=["a screen-printed poster","an editorial magazine spread","a matte risograph print","a studio photograph","a 3D-rendered still","a hand-set letterpress piece","a woven textile panel","a cut-paper collage","a cyanotype print","a gouache study","a vinyl record sleeve","a packaging mockup"];
  const fmt = mediaMeta.length ? mediaMeta.join(" / ") : R(formats);
  const palLines = pal.length ? [`Palette of ${pal.join(", ")}, used with intent.`,`Built on ${pal.join(", ")}, colour doing the work.`,`Colour led by ${pal.join(", ")}.`] : [""];
  const lights=["light raking across the forms","flat, even studio light","low directional light with deep shadow","soft daylight with gentle falloff","hard noon light and crisp edges","diffuse overcast glow"];
  const comps=["deliberate composition with clear hierarchy","off-grid layout with confident negative space","tight, centred framing","asymmetric balance and generous margins","dense, layered arrangement"];
  const tex=["tactile texture and honest materials","fine grain and visible paper tooth","smooth, matte surfaces","worn, analogue imperfection","crisp vector flatness against subtle noise"];
  const connect=["It coheres through one disciplined mood.","Everything bends to a single intent.","Held together by one unwavering tone.","Restraint is what ties it together.","A single idea runs through every element."];
  const tech=["4:5, high detail, editorial finish.","3:4, fine grain.","1:1, crisp and considered.","2:3, high contrast.","16:9, soft film grain.","4:5, muted matte finish."];
  const subject = (titles[0] && !isBadTitle(titles[0])) ? titles[0] : "an original abstract composition";
  let s = `${R(openers)} ${subject}, as ${fmt}.`;
  const pl=R(palLines); if(pl) s += " "+pl;
  s += ` ${cap(R(lights))}; ${R(comps)}.`;
  s += ` ${cap(R(tex))}; clean surfaces, no stray lettering or labels.`;
  if(dates.length) s += ` Period cues from the ${dates.join(", ")} era.`;
  s += ` ${R(connect)} ${R(tech)}`;
  return s;
}

const SelCtx = createContext(null);

function useRoute(){
  const [hash,setHash]=useState(window.location.hash||"#/explore");
  useEffect(()=>{const f=()=>setHash(window.location.hash||"#/explore");
    window.addEventListener("hashchange",f);return()=>window.removeEventListener("hashchange",f);},[]);
  const parts=hash.replace(/^#\//,"").split("/");
  if(parts[0]==="c"&&parts[1]) return{name:"collection",id:decodeURIComponent(parts.slice(1).join("/"))};
  if(parts[0]==="u"&&parts[1]) return{name:"curator",handle:decodeURIComponent(parts.slice(1).join("/"))};
  return{name:"explore"};
}
const go = href => { window.location.hash = href; window.scrollTo(0,0); };
const linkColl = id => `#/c/${encodeURIComponent(id)}`;
const linkCur  = h  => `#/u/${encodeURIComponent(h)}`;
// Make a short, clean collection title from messy source metadata (captions etc.).
function displayTitle(c){
  if(!c) return "Untitled";
  let t=(c.title||"").replace(/https?:\/\/\S+/g,"").replace(/[@#][\w.\-]+/g,"").replace(/["“”']/g,"").replace(/\s+/g," ").trim();
  if(/\.(png|jpe?g|gif|webp|svg|tiff?)$/i.test(t)||/^[0-9a-f]{8}-[0-9a-f]{4}/i.test(t)||/^[0-9a-f]{12,}$/i.test(t)) t="";
  const words=t.split(" ").filter(Boolean);
  if(words.length>5) t=words.slice(0,5).join(" ");
  t=t.replace(/[\s,;:\-–—.]+$/,"");
  if(!t){ const who=c.curatorName||c.curator; t = who?("Selected by "+who):"A selection"; }
  return t.charAt(0).toUpperCase()+t.slice(1);
}

function Img({src,alt,className,style}){
  const [err,setErr]=useState(false);
  if(err||!src) return <div className={className} style={{...style,background:"var(--ambersoft)"}} aria-label={alt}/>;
  return <img src={src} alt={alt} className={className} style={style} loading="lazy" decoding="async" onError={()=>setErr(true)}/>;
}
const SPAN_H=[320,220,208,220,320,208,220,320,208,320,220,208];

function Card({c,i}){
  const {has,toggle}=useSel();
  const coverItem={id:"cover:"+c.id,src:c.cover,alt:c.title,by:c.curatorName,medium:null,date:null};
  const picked=c.cover?has(coverItem):false;
  return (
    <div className="card">

function Explore({searchOpen,setSearchOpen,onSources}){
  const [input,setInput]=useState(""),[query,setQuery]=useState(""),[cat,setCat]=useState("Featured");
  const [nonce,setNonce]=useState(0);
  const featuredQ=useMemo(()=>pick(FEATURED_SEEDS),[]);
  const heroQuote=useMemo(()=>pick(DESIGN_QUOTES),[]);
  const [catsShown,setCatsShown]=useState(["Featured","Brutalist","Bauhaus","Swiss","Risograph","Collage","Y2K","Maximal","Monochrome","Surreal"]);
  const triedRef=useRef(new Set());
  const [advColor,setAdvColor]=useState(""),[hexIn,setHexIn]=useState("");
  const [eraIdx,setEraIdx]=useState(-1); // -1 = Any (home floor)
  const [items,setItems]=useState([]);
  const [status,setStatus]=useState("loading"); // loading | idle | error
  const [more,setMore]=useState(false);
  const [end,setEnd]=useState(false);
  const pageRef=useRef(SESSION_PAGE), reqRef=useRef(0);
  const colCountFor=()=>{ if(typeof window==="undefined")return 4; const w=window.innerWidth;
    return w<=480?2 : w<=820?3 : w<=1200?4 : w<=1600?5 : w<=2100?6 : 7; };
  const [colCount,setColCount]=useState(colCountFor);
  useEffect(()=>{ const f=()=>setColCount(colCountFor()); window.addEventListener("resize",f); return ()=>window.removeEventListener("resize",f); },[]);
  // Stable masonry: items go into fixed columns by index, so appending on scroll
  // never reshuffles existing cards (CSS multi-column reflow was the cause of jumps).
  const columns=useMemo(()=>{ const cols=Array.from({length:colCount},()=>[]);
    items.forEach((c,i)=>cols[i%colCount].push([c,i])); return cols; },[items,colCount]);

  useEffect(()=>{const t=setTimeout(()=>setQuery(input),350);return()=>clearTimeout(t);},[input]);

  // Typed words (incl. colours like "green") are a TEXT meta-search across all
  // sources. Pixel-colour matching only happens via the advanced colour picker.
  const color = advColor;
  const catQ = cat!=="Featured"?CAT_Q[cat]:null;
  const textQ = query.trim() || catQ || featuredQ || "design";
  const colorText = query.trim() || catQ || null;
  const rankQ = query.trim() || catQ || null;
  const applyHex=()=>{ if(isHex(hexIn)) setAdvColor(normHex(hexIn)); };
  const setYears=()=>{ if(eraIdx>=0){YEAR_FROM=ERA_BUCKETS[eraIdx][1];YEAR_TO=ERA_BUCKETS[eraIdx][2];}else{YEAR_FROM=HOME_FLOOR;YEAR_TO=null;} };

  // reset + initial load
  useEffect(()=>{ const rid=++reqRef.current; setYears();
    setStatus("loading"); setItems([]); setEnd(false); pageRef.current=SESSION_PAGE;
    const run = color ? colorSearchCollections(color,colorText,24) : listCollections(textQ,24,SESSION_PAGE,rankQ);
    run.then(cols=>{ if(rid!==reqRef.current)return; setItems(cols); setStatus("idle"); if(color) setEnd(true);
      // Guarantee filters carry relevant content: swap a thin lens for a fresh one.
      if(!color && !query.trim() && cat!=="Featured" && cols.length<3 && !triedRef.current.has(cat)){
        triedRef.current.add(cat);
        const used=new Set(catsShown);
        const backup=Object.keys(CAT_Q).find(k=>k!=="Featured"&&!used.has(k)&&!triedRef.current.has(k));
        if(backup){ setCatsShown(prev=>prev.map(c=>c===cat?backup:c)); setCat(backup); }
      }
    }).catch(()=>{ if(rid!==reqRef.current)return; setStatus("error"); });
  },[cat,query,advColor,eraIdx,featuredQ,nonce]);

  const loadMore=useCallback(()=>{
    if(color||end||more||status!=="idle")return;
    setMore(true); setYears(); const np=pageRef.current+1;
    listCollections(textQ,24,np,rankQ).then(cols=>{
      setItems(prev=>{const seen=new Set(prev.map(x=>x.id));const add=cols.filter(x=>!seen.has(x.id));
        if(!add.length) setEnd(true); return [...prev,...add];});
      pageRef.current=np; setMore(false);
    }).catch(()=>{setMore(false);setEnd(true);});
  },[textQ,color,end,more,status,eraIdx]);

  useEffect(()=>{ if(color||end||status!=="idle")return;
    const onScroll=()=>{ if(window.innerHeight+window.scrollY >= document.body.offsetHeight-900) loadMore(); };
    window.addEventListener("scroll",onScroll,{passive:true}); onScroll();
    return ()=>window.removeEventListener("scroll",onScroll);
  },[loadMore,color,end,status]);

  return (
    <div>
      <div className="hero">
        <h1>Where taste gets credit.</h1>
        <p>“{heroQuote.t}” — {heroQuote.a}</p>
        <div className="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style={{flexShrink:0,opacity:.4}}>
            <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Search by style, colour, or theme"/>
        </div>
        <div className="pills">
          {catsShown.map(c=>(
            <button key={c} className={"pill"+(c===cat?" active":"")} onClick={()=>{setCat(c);setInput("");setQuery("");}}>{c}</button>))}
          <button className="tunebtn" title="Filter by era" onClick={()=>setSearchOpen(true)}><span className="material-symbols-outlined">discover_tune</span></button>
        </div>
      </div>
      <div className="feed">
        {status==="loading"?<div style={{display:"flex",gap:18,alignItems:"flex-start"}}>
          {Array.from({length:colCount}).map((_,ci)=>(<div key={ci} style={{flex:1,minWidth:0}}>
            {Array.from({length:3}).map((_,i)=><div className="card" key={i}><div className="skel" style={{height:[320,220,260][(ci+i)%3]}}/></div>)}
          </div>))}</div>
          :status==="error"?<ErrorState onRetry={()=>setNonce(n=>n+1)}/>
          :items.length===0?<div className="empty">nothing here yet — try a different search</div>
          :<div style={{display:"flex",gap:18,alignItems:"flex-start"}}>
            {columns.map((col,ci)=>(<div key={ci} style={{flex:1,minWidth:0}}>
              {col.map(([c,i])=><Card key={c.id} c={c} i={i}/>)}
            </div>))}
          </div>}
        {more&&<div className="loader"><span className="material-symbols-outlined loadericon">package_2</span></div>}
      </div>
      {searchOpen&&(
        <div className="overlay" style={{alignItems:"flex-start"}} onClick={()=>setSearchOpen(false)}>
          <div className="modal" style={{marginTop:"9vh",maxWidth:780}} onClick={e=>e.stopPropagation()}>
            <h3>Filter by era</h3>
            <div className="msub">Show work from a chosen decade range.</div>
            <div className="adv-row" style={{flexWrap:"nowrap",overflowX:"auto"}}><span className="adv-lab">Era</span>
              <button className={"opt"+(eraIdx<0?" active":"")} onClick={()=>setEraIdx(-1)}>Any</button>
              {ERA_BUCKETS.map(([lab],i)=>(<button key={lab} className={"opt"+(eraIdx===i?" active":"")} onClick={()=>setEraIdx(eraIdx===i?-1:i)}>{lab}</button>))}
            </div>
            <div className="mfoot"><button className="btn btn-primary" onClick={()=>setSearchOpen(false)}>Show results</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function Tile({it}){
  const {has,toggle}=useSel(); const picked=has(it);
  const tile=(
    <div className={"tile"+(picked?" picked":"")}>
      <Img src={it.src} alt={it.alt} style={{height:208}}/>
      <div className={"sel"+(picked?" on":"")} title="Add to collection"
        onClick={e=>{e.preventDefault();e.stopPropagation();toggle(it);}}><span className="material-symbols-outlined">{picked?"check":"add"}</span></div>
    </div>);
  return it.sourceUrl? <a href={it.sourceUrl} target="_blank" rel="noopener noreferrer" title={it.alt}>{tile}</a> : <div>{tile}</div>;
}

function CollectionDetail({id}){
  const [st,setSt]=useState({loading:true,error:false,col:null,related:[]});
  const [relRanked,setRelRanked]=useState([]);
  const [saved,setSaved]=useState(false),[following,setFollowing]=useState(false),[nonce,setNonce]=useState(0);
  const {selectMany}=useSel();
  useEffect(()=>{let on=true;setSt({loading:true,error:false,col:null,related:[]});setRelRanked([]);
    getCollection(id).then(r=>on&&setSt({loading:false,error:false,col:r.collection,related:r.related}))
      .catch(()=>on&&setSt({loading:false,error:true,col:null,related:[]}));
    return()=>{on=false;};},[id,nonce]);
  // re-rank related by real visual similarity (tone/hue histogram cosine)
  useEffect(()=>{ if(!st.col||!st.related.length){setRelRanked(st.related||[]);return;} let on=true;
    (async()=>{ const base=await analyzeImage(st.col.cover);
      const scored=await Promise.all(st.related.map(async r=>{const a=await analyzeImage(r.cover);
        return {...r,vscore:(base&&a)?cosine(base.vec,a.vec):null};}));
      if(base&&scored.some(s=>s.vscore!=null)) scored.sort((x,y)=>(y.vscore||0)-(x.vscore||0));
      if(on)setRelRanked(scored); })();
    return()=>{on=false;}; },[st.col,st.related]);
  if(st.loading) return(<div className="shell"><button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button>
    <div className="skel" style={{height:36,width:280,marginTop:16}}/>
    <div className="dgrid">{Array.from({length:8}).map((_,i)=><div key={i} className="skel" style={{height:208}}/>)}</div></div>);
  if(st.error||!st.col) return(<div className="shell"><button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button><ErrorState onRetry={()=>setNonce(n=>n+1)}/></div>);
  const c=st.col;
  return (
    <div className="shell">
      <button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button>
      <h1 className="dtitle">{displayTitle(c)}</h1>
      <div className="actions">
        <button className={"btn btn-primary"+(saved?" on":"")} onClick={()=>setSaved(s=>!s)}>{saved?"Saved":"Save collection"}</button>
        <button className={"btn btn-ghost"+(following?" on":"")} onClick={()=>setFollowing(s=>!s)}>{following?"Following":"Follow curator"}</button>
        <button className="btn btn-ghost" onClick={()=>selectMany(c.items)}>Select all for prompt</button>
      </div>
      <div className="note">
        <span className="lead">Curate, then conjure.</span>
        <span className="body">Add the pieces that move you with <b>+</b>, then turn the set into a prompt. Every save stays credited to <a onClick={()=>go(linkCur(c.curatorId))}>@{c.curator}</a> — when their taste travels, they earn.</span>
      </div>
      <div className="dgrid">{c.items.map(it=><Tile key={it.id} it={it}/>)}</div>
      {relRanked.length>0&&(<div>
        <div className="label" style={{marginTop:48}}><div className="l">More like this</div>
          <div className="r">{relRanked.some(r=>r.vscore!=null)?"ranked by visual similarity":"related collections"}</div></div>
        <div className="dgrid" style={{marginTop:4}}>{relRanked.map(r=>(
          <div key={r.id} className="card" onClick={()=>go(linkColl(r.id))}>
            <div className="tile" style={{position:"relative"}}><Img src={r.cover} alt={r.title} style={{height:160}}/>
              {r.vscore!=null&&<span className="chip" style={{position:"absolute",top:8,left:8}}>{Math.round(r.vscore*100)}% match</span>}</div>
            <div className="title" style={{marginTop:8}}>{displayTitle(r)}</div>
            <div className="sub">@{r.curator}</div></div>))}</div></div>)}
    </div>
  );
}

function CuratorProfile({handle}){
  const [st,setSt]=useState({loading:true,error:false,curator:null,cols:[]});
  const [following,setFollowing]=useState(false),[nonce,setNonce]=useState(0);
  useEffect(()=>{let on=true;setSt({loading:true,error:false,curator:null,cols:[]});
    getCurator(handle).then(r=>on&&setSt({loading:false,error:false,curator:r.curator,cols:r.collections}))
      .catch(()=>on&&setSt({loading:false,error:true,curator:null,cols:[]}));
    return()=>{on=false;};},[handle,nonce]);
  if(st.loading) return(<div className="shell"><button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button>
    <div className="skel" style={{height:56,width:56,borderRadius:999,marginTop:20}}/><div className="skel" style={{height:96,marginTop:24,borderRadius:12}}/></div>);
  if(st.error||!st.curator) return(<div className="shell"><button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button><ErrorState onRetry={()=>setNonce(n=>n+1)}/></div>);
  const cur=st.curator,cols=st.cols,totalEl=cols.reduce((s,c)=>s+(c.n||0),0);
  return (
    <div className="shell">
      <button className="backbtn" onClick={()=>go("#/explore")}>← Go back</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:24,marginTop:20,flexWrap:"wrap"}}>
        <div style={{maxWidth:460}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            {cur.avatar?<img className="avatar" src={cur.avatar} alt={cur.name}/>:<div className="avatar">{(cur.name||"?").charAt(0)}</div>}
            <div><h1 className="wm" style={{fontSize:24,margin:0}}>{cur.name}</h1><div className="dsub">@{slug(cur.name)}</div></div>
          </div>
          {cur.bio&&<p style={{fontSize:14,lineHeight:1.6,marginTop:16}}>{cur.bio}</p>}
        </div>
        <button className={"btn btn-primary"+(following?" on":"")} onClick={()=>setFollowing(s=>!s)} style={{padding:"8px 20px"}}>{following?"Following":"Follow"}</button>
      </div>
      <div className="standing">
        <div className="row"><span className="tiny" style={{textTransform:"uppercase",letterSpacing:".04em"}}>Curator standing</span></div>
        <div className="stats">
          {cur.followers!=null&&<div className="stat"><div className="v">{cur.followers.toLocaleString()}</div><div className="k">Followers</div></div>}
          <div className="stat"><div className="v">{cols.length}</div><div className="k">Collections</div></div>
          <div className="stat"><div className="v">{totalEl.toLocaleString()}</div><div className="k">Total elements</div></div>
          <div className="stat"><div className="v">— (model)</div><div className="k">Earned</div></div>
        </div>
        <p className="tiny" style={{marginTop:16}}>Tier and earnings are part of Sourced's payout model, not yet present in this data.</p>
      </div>
      <div className="sec">Collections</div>
      {cols.length===0?<p style={{fontSize:13,color:"var(--soft)",marginTop:12}}>No public collections found.</p>
        :<div className="grid" style={{marginTop:16}}>{cols.map((c,i)=><Card key={c.id} c={c} i={i}/>)}</div>}
    </div>
  );
}

function noteLine(n){
  if(!n) return "";
  const parts=[];
  if(n.subject) parts.push(n.subject);
  if(n.palette&&n.palette.length) parts.push([].concat(n.palette).join(", "));
  if(n.texture) parts.push(n.texture);
  if(n.detail) parts.push(n.detail);
  return parts.join(" — ");
}
function PromptModal({items,onClose}){
  const [out,setOut]=useState("");
  const [busy,setBusy]=useState(true);
  const [err,setErr]=useState("");
  const [copied,setCopied]=useState(false);
  const [notes,setNotes]=useState(null);
  const run=useCallback(async()=>{
    setErr("");setBusy(true);setCopied(false);setNotes(null);
    const meta=await collectMeta(items);
    const k=getKey();
    try{
      if(k){ const {text,notes:n}=await generatePromptLLM(items,k,meta); setOut(text); if(n&&n.length)setNotes(n); }
      else { setOut(draftPromptFromMetadata(items,meta)); }
    }catch(e){ setErr(String(e.message||e)); setOut(draftPromptFromMetadata(items,meta)); }
    setBusy(false);
  },[items]);
  useEffect(()=>{ run(); /* auto-generate on open */ },[]);
  const copy=()=>{ if(navigator.clipboard){navigator.clipboard.writeText(out);setCopied(true);setTimeout(()=>setCopied(false),1500);} };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Your prompt</h3>
        <div className="msub">Edit anything above before copying.{notes&&" Hover an image to see what it contributed."}</div>
        <div className="thumbs">{items.slice(0,12).map((it,i)=>
          <img key={it.id} src={it.src} alt="" title={notes&&notes[i]?noteLine(notes[i]):undefined}/>)}</div>
        {busy
          ? <div className="loader" style={{padding:"30px 0"}}><span className="material-symbols-outlined loadericon">package_2</span></div>
          : <div>
              <textarea className="result" value={out} onChange={e=>setOut(e.target.value)} spellCheck={false}/>
              {err&&<div className="tiny" style={{color:"var(--accentText)",marginTop:8}}>AI call failed ({err}). Showing a metadata draft.</div>}
              <div className="mfoot">
                <button className="btn btn-primary" onClick={copy}>{copied?"Copied ✓":"Copy prompt"}</button>
                <button className="btn btn-ghost" onClick={run}>↻ Regenerate</button>
              </div>
            </div>}
      </div>
    </div>
  );
}

function KeysModal({onClose}){
  const [tb,setTb]=useState(keyGet("tumblr"));
  const [un,setUn]=useState(keyGet("unsplash"));
  const [px,setPx]=useState(keyGet("pexels"));
  const [pb,setPb]=useState(keyGet("pixabay"));
  const save=()=>{keySet("tumblr",tb.trim());keySet("unsplash",un.trim());keySet("pexels",px.trim());keySet("pixabay",pb.trim());window.location.reload();};
  const field=(label,val,set,ph)=>(
    <label className="tiny" style={{display:"block",marginBottom:10}}>{label}
      <input type="password" value={val} onChange={e=>set(e.target.value)} placeholder={ph}
        style={{display:"block",width:"100%",marginTop:4,border:"1px solid var(--lineS)",borderRadius:8,padding:"8px 12px",font:"inherit",fontSize:12.5}}/></label>);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Connect image sources</h3>
        <div className="msub">Optional. Keys are stored only in this browser and add more imagery to the feed.</div>
        {field("Tumblr — API key (designer/artist curation)",tb,setTb,"OAuth consumer key")}
        {field("Unsplash — Access Key",un,setUn,"Client-ID / Access Key")}
        {field("Pexels — API Key",px,setPx,"API key")}
        {field("Pixabay — API Key",pb,setPb,"API key")}
        <div className="mfoot">
          <button className="btn btn-primary" onClick={save}>Save & reload</button>
          <span className="tiny">free keys at each provider's developer page</span>
        </div>
      </div>
    </div>
  );
}

function App(){
  const route=useRoute();
  const [sel,setSel]=useState([]);
  const [modal,setModal]=useState(false);
  const [keysOpen,setKeysOpen]=useState(false);
  const [searchOpen,setSearchOpen]=useState(false);
  const has=useCallback(it=>sel.some(s=>s.src===it.src),[sel]);
  const toggle=useCallback(it=>setSel(s=>s.some(x=>x.src===it.src)?s.filter(x=>x.src!==it.src):[...s,it]),[]);
  const selectMany=useCallback(items=>setSel(s=>{const m=new Map(s.map(x=>[x.src,x]));items.forEach(it=>it.src&&m.set(it.src,it));return[...m.values()];}),[]);
  const clear=useCallback(()=>setSel([]),[]);
  const ctx={sel,has,toggle,selectMany,clear};
  let page;
  if(route.name==="collection") page=<CollectionDetail id={route.id}/>;
  else if(route.name==="curator") page=<CuratorProfile handle={route.handle}/>;
  else page=<Explore searchOpen={searchOpen} setSearchOpen={setSearchOpen} onSources={()=>setKeysOpen(true)}/>;
  return (
    <SelCtx.Provider value={ctx}>
      <Header/>
      {page}
      <div className="shell"><div className="footer">
        <span className="wm logo" style={{fontSize:20}}>SSSSOURCED</span></div></div>
      {sel.length>0&&(<div className="selbar">
        <span className="c">{sel.length} in collection</span>
        <span className="x" onClick={clear}>clear</span>
        <button className="go" onClick={()=>setModal(true)}>Generate prompt →</button>
      </div>)}
      {modal&&<PromptModal items={sel} onClose={()=>setModal(false)}/>}
      {keysOpen&&<KeysModal onClose={()=>setKeysOpen(false)}/>}
    </SelCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
/* Favicon: render the Material Symbols "package_2" glyph to a canvas. */
(function(){
  function setFav(){
    try{
      var c=document.createElement("canvas"); c.width=64; c.height=64;
      var x=c.getContext("2d");
      x.fillStyle="#1f1f1f";
      x.font='52px "Material Symbols Outlined"';
      x.textAlign="center"; x.textBaseline="middle";
      x.fillText("package_2",32,34);
      var href=c.toDataURL("image/png");
      var l=document.querySelector("link[rel~='icon']")||document.createElement("link");
      l.rel="icon"; l.type="image/png"; l.href=href; document.head.appendChild(l);
    }catch(e){}
  }
  if(document.fonts&&document.fonts.load){
    document.fonts.load('52px "Material Symbols Outlined"',"package_2").then(function(){setTimeout(setFav,150);},function(){setTimeout(setFav,800);});
  } else { setTimeout(setFav,1200); }
})();
</script>
